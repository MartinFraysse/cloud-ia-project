# Réplicas Redis en lecture seule. Ils se synchronisent sur le leader dont le nom DNS est
# donné par REDIS_LEADER_SERVICE_HOST (ConfigMap redis-follower-config). Sans disque : en
# cas de redémarrage, ils recopient tout depuis le leader.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-follower
  labels:
    app.kubernetes.io/name: guestbook
    app.kubernetes.io/instance: guestbook
    app.kubernetes.io/component: redis-follower
    app.kubernetes.io/part-of: livre-or-cloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: guestbook
      app.kubernetes.io/instance: guestbook
      app.kubernetes.io/component: redis-follower
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guestbook
        app.kubernetes.io/instance: guestbook
        app.kubernetes.io/component: redis-follower
        app.kubernetes.io/part-of: livre-or-cloud
    spec:
      containers:
        - name: follower
          image: us-docker.pkg.dev/google-samples/containers/gke/gb-redis-follower:v2
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: redis-follower-config
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:          # vérifie que Redis RÉPOND (pas seulement que le port est ouvert)
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
