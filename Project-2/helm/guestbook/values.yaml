# Valeurs PAR DÉFAUT du chart guestbook. Chaque environnement ne surcharge que ce qui
# change dans values-<ENV>.yaml. Toutes les clés sont commentées.

# -- Surcharge du nom du chart dans les noms d'objets (vide = "guestbook").
nameOverride: ""
# -- Surcharge du nom complet des objets (vide = "<release>-guestbook", ex. stack-dev-guestbook).
fullnameOverride: ""
# -- Valeur du label app.kubernetes.io/part-of posé sur tous les objets.
partOf: livre-or-cloud

# -- Labels ajoutés à TOUS les objets (jamais dans les sélecteurs). Clé: valeur libres.
commonLabels:
  # Environnement de la release (dev | staging | prod), surchargé par values-<ENV>.yaml.
  environment: local
  # Équipe responsable de la plateforme.
  team: plateforme

# ---------------------------------------------------------------------------
# Frontend PHP / Apache
# ---------------------------------------------------------------------------
frontend:
  # -- Nombre de pods frontend (sans état : peut être augmenté librement).
  replicaCount: 1
  image:
    # -- Dépôt de l'image du frontend.
    repository: us-docker.pkg.dev/google-samples/containers/gke/gb-frontend
    # -- Tag de l'image (vide = appVersion du Chart.yaml). Jamais "latest".
    tag: ""
    # -- Politique de téléchargement : IfNotPresent car les tags sont figés.
    pullPolicy: IfNotPresent
  # -- Variables d'environnement du PHP (ConfigMap frontend → envFrom).
  #    Les adresses Redis (REDIS_*_SERVICE_HOST) sont ajoutées automatiquement : ne pas les mettre ici.
  env:
    # Mode de découverte de Redis : "env" = lire REDIS_*_SERVICE_HOST (fournies par la ConfigMap).
    GET_HOSTS_FROM: env
  service:
    # -- Nom du Service (vide = "<release>-guestbook-frontend").
    name: ""
    # -- Type : LoadBalancer (local + cloud ouvert) ou ClusterIP (test cloud via port-forward).
    type: LoadBalancer
    # -- Port exposé par le Service. Différent par environnement (sous macOS / Windows, minikube tunnel publie tout sur 127.0.0.1).
    port: 80
  # -- Ressources par conteneur (cpu en millicores, mémoire en Mi).
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # -- Readiness : retire le pod du Service tant qu'Apache ne répond pas sur "/".
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  # -- Liveness : redémarre Apache s'il ne répond plus pendant ~1 min.
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20

# ---------------------------------------------------------------------------
# Redis leader (écritures, persistant)
# ---------------------------------------------------------------------------
redisLeader:
  # -- 0 ou 1 uniquement : un seul leader, car le volume RWO ne se branche qu'à un seul pod.
  replicaCount: 1
  image:
    # -- Image Redis officielle.
    repository: docker.io/redis
    # -- Version de Redis (tag explicite).
    tag: "6.0.5"
    # -- Politique de téléchargement.
    pullPolicy: IfNotPresent
  service:
    # -- Nom du Service (vide = "<release>-guestbook-redis-leader"). Repris dans les ConfigMaps.
    name: ""
    # -- Port du Service. DOIT rester 6379 : il est codé en dur dans le PHP du frontend et le run.sh des followers.
    port: 6379
  # -- Ressources du conteneur leader.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # -- Readiness : Redis doit répondre PONG (pas seulement port ouvert).
  readinessProbe:
    exec:
      command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
    initialDelaySeconds: 5
    periodSeconds: 10
  # -- Liveness : redémarre Redis s'il ne répond plus pendant ~1 min.
  livenessProbe:
    exec:
      command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
    initialDelaySeconds: 15
    periodSeconds: 20
  persistence:
    # -- Taille du volume (ex. 1Gi, 5Gi). Peut être augmentée, jamais réduite.
    size: 1Gi
    # -- Mode d'accès : ReadWriteOnce (un seul nœud monte le volume, cohérent avec Recreate).
    accessMode: ReadWriteOnce
    # -- StorageClass. "" = champ omis = classe PAR DÉFAUT du cluster (standard / standard-rwo).
    storageClass: ""
    # -- true = annotation helm.sh/resource-policy: keep → le PVC survit à helm uninstall.
    keep: false

# ---------------------------------------------------------------------------
# Redis followers (lectures, sans disque)
# ---------------------------------------------------------------------------
redisFollower:
  # -- Nombre de followers (lectures du frontend).
  replicaCount: 1
  image:
    # -- Image follower de l'exemple Google (script run.sh de réplication).
    repository: us-docker.pkg.dev/google-samples/containers/gke/gb-redis-follower
    # -- Tag explicite.
    tag: v2
    # -- Politique de téléchargement.
    pullPolicy: IfNotPresent
  service:
    # -- Nom du Service (vide = "<release>-guestbook-redis-follower"). Repris dans la ConfigMap frontend.
    name: ""
    # -- Port du Service. DOIT rester 6379 : il est codé en dur dans le PHP du frontend.
    port: 6379
  # -- Ressources du conteneur follower.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # -- Readiness : Redis doit répondre PONG.
  readinessProbe:
    exec:
      command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
    initialDelaySeconds: 5
    periodSeconds: 10
  # -- Liveness : redémarrage après ~1 min sans réponse.
  livenessProbe:
    exec:
      command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
    initialDelaySeconds: 15
    periodSeconds: 20
