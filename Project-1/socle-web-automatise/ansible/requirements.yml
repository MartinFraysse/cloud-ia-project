---
# requirements.yml — dépendances Ansible Galaxy du socle, versions ÉPINGLÉES (reproductibilité).
#
# Installation, en une commande, depuis le dossier ansible/ (dans le controller) :
#   ansible-galaxy install -r requirements.yml
# -> collections dans ansible/collections/, rôles dans ansible/roles/ (ignorés par Git).
#
# Compatibilité vérifiée avec ansible-core 2.17 (cf. local/controller/requirements.txt).
# Justification du rôle public : docs/decisions.md (ADR-04).

roles:
  # Installation de nginx + nginx.conf validé par "nginx -t" (licence MIT, Debian supporté).
  # Le site Fleet Info et la page /status sont gérés par NOTRE rôle "webserver".
  - name: geerlingguy.nginx
    version: "3.3.1"

collections:
  # Plugin d'inventaire dynamique google.cloud.gcp_compute (environnement cloud).
  - name: google.cloud
    version: "1.15.0"
  # Modules timezone (rôle common) et htpasswd (rôle webserver).
  - name: community.general
    version: "12.6.7"
