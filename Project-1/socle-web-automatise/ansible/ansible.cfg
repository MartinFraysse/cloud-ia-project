[defaults]
inventory = inventories/local/hosts.ini
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = yaml
roles_path = roles
# Texte de {{ ansible_managed }}, injecté en tête de chaque fichier généré.
# Pas de date dedans : une date changerait à chaque run et casserait l'idempotence.
ansible_managed = Géré par Ansible (socle-web-automatise) - toute modification manuelle sera écrasée

[privilege_escalation]
become = False
