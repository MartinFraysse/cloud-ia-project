# =============================================================================
# ansible.cfg — configuration Ansible du socle, IDENTIQUE en local et sur le cloud.
#
# Chargé via la variable ANSIBLE_CONFIG (positionnée par local/docker-compose.yml dans le
# controller) ou automatiquement quand on lance Ansible depuis le dossier ansible/.
# Les chemins relatifs ci-dessous sont résolus par rapport à l'emplacement de CE fichier.
# =============================================================================

[defaults]
# Inventaire par défaut : le banc local Docker Compose.
# Le cloud se cible explicitement : -i inventories/cloud/fleet.gcp.yml
inventory = inventories/local/hosts.yml

# Rôle public (geerlingguy.nginx) et collections installés par
# "ansible-galaxy install -r requirements.yml" DANS le projet (dossiers ignorés par Git) :
# les versions épinglées sont donc celles réellement utilisées, quel que soit le poste.
roles_path = roles
collections_path = collections

# Mot de passe Ansible Vault : fichier NON versionné à la racine du socle
# (socle-web-automatise/.vault_pass, cf. README § « Prérequis et accès »).
vault_password_file = ../.vault_pass

interpreter_python = auto_silent
retry_files_enabled = False

# site.yml enchaîne plusieurs plays : "smart" collecte les facts UNE fois par hôte et par
# exécution (cache mémoire) au lieu de les recollecter à chaque play.
gathering = smart

# Sortie lisible (YAML) avec le callback par défaut. Remplace l'ancien callback
# community.general.yaml, retiré de community.general 12.
callback_result_format = yaml

# Texte de {{ ansible_managed }}, placé en tête de chaque fichier généré par template.
# Pas de date ni de chemin absolu : ils changeraient d'une exécution (ou d'un poste) à
# l'autre et casseraient l'idempotence (changed=0 au second passage).
ansible_managed = Géré par Ansible (socle-web-automatise) - NE PAS MODIFIER À LA MAIN : toute modification manuelle sera écrasée au prochain déploiement

[inventory]
# "auto" reconnaît google.cloud.gcp_compute grâce au suffixe .gcp.yml du fichier d'inventaire.
enable_plugins = host_list, yaml, ini, auto, google.cloud.gcp_compute

[privilege_escalation]
# Pas d'élévation par défaut : chaque play qui en a besoin le déclare (become: true).
become = False

[ssh_connection]
# Envoie les modules sur l'entrée standard de SSH au lieu de copier un fichier temporaire :
# nettement plus rapide. Compatible avec le sudo par défaut de Debian (pas de requiretty).
pipelining = True
