---
# inventories/local/hosts.yml — inventaire STATIQUE du banc local (conteneurs de local/docker-compose.yml).
#
# Il produit le MÊME nom de groupe que l'inventaire dynamique GCP : "web". site.yml cible "web"
# et fonctionne donc sans modification dans les deux environnements.
# Les noms node1/node2 sont résolus par le DNS interne du réseau Docker "labnet" : aucune IP ici.
# Ajouter un nœud local : déclarer le service dans docker-compose.yml PUIS l'hôte ci-dessous
# (runbook « Ajouter ou retirer un serveur », docs/runbooks.md).
all:
  children:
    web:
      hosts:
        node1:
        node2:
