---
# Rôle : variables propres à l'environnement LOCAL.
# Chargé uniquement quand on utilise l'inventaire inventories/local.

# Connexion SSH vers les conteneurs
ansible_user: ansible
ansible_ssh_private_key_file: /workspace/local/ssh/fleet_key
ansible_host_key_checking: false

# Identité de l'environnement, lue par les rôles via leurs defaults
socle_env: local
