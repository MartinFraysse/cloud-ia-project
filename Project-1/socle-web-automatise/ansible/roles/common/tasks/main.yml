# Rôle common — socle de tout serveur : paquets, fuseau horaire,
# utilisateur d'exploitation, bannière de connexion.
# Pas de become ici : il est posé au niveau du play (site.yml).
---
- name: Installer les paquets de base
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true

- name: Régler le fuseau horaire
  # Passe par timedatectl (systemd) : c'est pour ça que les nœuds ont systemd + dbus
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Créer l'utilisateur d'exploitation
  ansible.builtin.user:
    name: "{{ common_ops_user }}"
    comment: "Compte d'exploitation (géré par Ansible)"
    shell: /bin/bash
    groups: "{{ common_ops_user_groups }}"
    append: true          # AJOUTE ces groupes sans retirer ceux que le compte aurait déjà
    create_home: true

- name: Déployer le message du jour (motd)
  ansible.builtin.template:
    src: motd.j2
    dest: "{{ common_motd_path }}"
    owner: root
    group: root
    mode: "0644"
